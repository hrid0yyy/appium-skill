[pytest]
testpaths = tests
# project root on sys.path so `config`, `core`, `pages` import cleanly
pythonpath = .
addopts = -ra --strict-markers
markers =
    android: test runs against an Android device/emulator via UiAutomator2
    windows: test runs against a Windows desktop app via the Appium Windows driver
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_file = artifacts/test-run.log
log_file_level = DEBUG
